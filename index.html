<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daylight To-Do</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-shell">
    <section class="app-card" aria-labelledby="page-title">
      <header class="hero">
        <div>
          <p class="eyebrow">YOUR DAILY SPACE</p>
          <h1 id="page-title">Make room for<br /><em>what matters.</em></h1>
        </div>
        <div class="date-chip" id="dateDisplay" aria-label="Today's date"></div>
      </header>

      <form class="add-form" id="todoForm">
        <label class="sr-only" for="todoInput">Add a new task</label>
        <input id="todoInput" type="text" maxlength="120" placeholder="What needs your attention?" autocomplete="off" />
        <button type="submit" aria-label="Add task">Add task <span>＋</span></button>
      </form>

      <div class="toolbar">
        <div class="filter-tabs" role="group" aria-label="Filter tasks">
          <button class="filter active" data-filter="all" type="button">All <span id="allCount">0</span></button>
          <button class="filter" data-filter="active" type="button">Open <span id="activeCount">0</span></button>
          <button class="filter" data-filter="completed" type="button">Done <span id="completedCount">0</span></button>
        </div>
        <button class="clear-button" id="clearCompleted" type="button">Clear completed</button>
      </div>

      <ul class="todo-list" id="todoList" aria-live="polite"></ul>
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">✦</div>
        <p id="emptyTitle">Your list is clear.</p>
        <span id="emptyText">Add a small step and make today count.</span>
      </div>

      <footer class="progress-footer">
        <div class="progress-label"><span>Daily progress</span><strong id="progressText">0%</strong></div>
        <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
      </footer>
    </section>
    <p class="storage-note"><span>●</span> Saved privately in your browser</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
